# 道路病害目标检测数据集配置
# Road Disease Detection Dataset Configuration

path: ../data           # 数据集根目录（相对于此文件）
train: images/train     # 训练集图片路径
val: images/val         # 验证集图片路径

# 类别定义
names:
  0: transverse_crack   # 横向裂缝
  1: longitudinal_crack # 纵向裂缝
  2: alligator_crack    # 龟裂（网状裂缝）
  3: pothole            # 坑槽
  4: patching           # 修补
  5: rutting            # 车辙
  6: subsidence         # 沉陷
  7: raveling           # 松散

nc: 8  # 类别总数
